<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Oficina - Clientes</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Clientes</h1>
    <nav><a href="principal.html">Voltar</a></nav>

    <div class="busca">
      <input type="text" id="termoBusca" placeholder="Buscar por nome" />
      <button id="botaoBuscar">Buscar</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>CPF</th>
          <th>Telefone</th>
          <th>E-mail</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabelaClientes"></tbody>
    </table>

    <h2>Cadastrar cliente</h2>
    <form id="formCadastrar">
      <input type="text" id="cadastrarNome" placeholder="Nome" required />
      <input type="text" id="cadastrarCpf" placeholder="CPF" required />
      <input type="text" id="cadastrarTelefone" placeholder="Telefone" />
      <input type="email" id="cadastrarEmail" placeholder="E-mail" />
      <button type="submit">Cadastrar</button>
    </form>

    <h2>Editar cliente</h2>
    <form id="formEditar">
      <input type="hidden" id="editarId" />
      <input type="text" id="editarNome" placeholder="Nome" required />
      <input type="text" id="editarCpf" placeholder="CPF" required />
      <input type="text" id="editarTelefone" placeholder="Telefone" />
      <input type="email" id="editarEmail" placeholder="E-mail" />
      <button type="submit">Salvar</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
