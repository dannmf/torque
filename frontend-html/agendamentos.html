<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Oficina - Agendamentos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Agendamentos</h1>
    <nav><a href="principal.html">Voltar</a></nav>

    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Servico</th>
          <th>Veiculo</th>
          <th>Cliente</th>
          <th>Alterar data</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabelaAgendamentos"></tbody>
    </table>

    <h2>Cadastrar agendamento</h2>
    <form id="formAgendamento">
      <select id="campoVeiculo" required>
        <option value="">Selecione o veiculo</option>
      </select>
      <input type="datetime-local" id="campoData" required />
      <input type="text" id="campoServico" placeholder="Servico" />
      <button type="submit">Cadastrar</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/agendamentos.js"></script>
</body>
</html>
