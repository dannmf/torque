<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Oficina - Veiculos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Veiculos</h1>
    <nav><a href="principal.html">Voltar</a></nav>

    <table>
      <thead>
        <tr>
          <th>Placa</th>
          <th>Marca</th>
          <th>Modelo</th>
          <th>Ano</th>
          <th>Cliente</th>
        </tr>
      </thead>
      <tbody id="tabelaVeiculos"></tbody>
    </table>

    <h2>Cadastrar veiculo</h2>
    <form id="formVeiculo">
      <select id="campoCliente" required>
        <option value="">Selecione o cliente</option>
      </select>
      <input type="text" id="campoPlaca" placeholder="Placa" required />
      <input type="text" id="campoMarca" placeholder="Marca" />
      <input type="text" id="campoModelo" placeholder="Modelo" />
      <input type="number" id="campoAno" placeholder="Ano" />
      <button type="submit">Cadastrar</button>
    </form>
    <p id="mensagemErro" class="erro"></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/veiculos.js"></script>
</body>
</html>
